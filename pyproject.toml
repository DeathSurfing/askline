[project]
name = "askline"
version = "1.0.0"
description = "A fast chat agent with one tool, web search, and timestamped memory."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "selectolax>=0.3",
  "langgraph>=1.0",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-anthropic>=0.3",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

filterwarnings = [
  "ignore::DeprecationWarning",
]
